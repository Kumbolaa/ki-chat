<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151921"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>KI-Chat</title></head><body>
<aside id="sidebar"><div class="side-top"><button id="new-chat" class="primary">＋ Neuer Chat</button><button id="close-menu" aria-label="Menü schließen">×</button></div><input id="search" type="search" placeholder="Chats durchsuchen"><div id="chat-list"></div><button id="settings">⚙ Einstellungen</button></aside>
<main><header><button id="menu" aria-label="Chats">☰</button><strong id="title">Neuer Chat</strong><div class="header-actions"><button id="rename" title="Umbenennen">✎</button><button id="export" title="Exportieren">⇧</button></div></header><section id="messages"><div id="empty"><div>◌</div><h1>Womit kann ich helfen?</h1><p>Deine Chats werden nur auf diesem Gerät gespeichert.</p></div></section><footer><div id="chips"><button data-toggle="thinking">Denkmodus</button><button data-toggle="selfCheck">Selbstprüfung</button><button data-toggle="precise">Genau</button></div><div id="composer"><textarea id="prompt" rows="1" placeholder="Nachricht schreiben …"></textarea><button id="send" class="primary">Senden</button></div></footer></main>
<dialog id="settings-dialog"><form method="dialog"><header><strong>Einstellungen</strong><button value="cancel">×</button></header><div class="form"><h2>Verbindung</h2><label>API-Key <input id="apiKey" type="password" autocomplete="off" placeholder="nvapi-…"></label><label>Basis-URL <input id="baseURL"></label><label>Modell <input id="model"></label><h2>Antworten</h2><label>Temperatur <output id="temperature-out"></output><input id="temperature" type="range" min="0" max="2" step=".05"></label><label>Top-p <output id="topP-out"></output><input id="topP" type="range" min=".1" max="1" step=".05"></label><label>Maximale Antwortlänge <input id="maxTokens" type="number" min="64" max="32768" step="64"></label><label>System-Anweisung <textarea id="systemPrompt" rows="5"></textarea></label><h2>Gedächtnis</h2><label class="check"><input id="memoryOn" type="checkbox"> Frühere Chats verwenden</label><label>Erinnerungen pro Antwort <input id="memoryHits" type="number" min="0" max="20"></label><label>Aktueller Kontext (Nachrichten) <input id="contextMessages" type="number" min="2" max="100"></label><h2>Darstellung</h2><label>Farbschema <select id="theme"><option value="dark">Dunkel</option><option value="light">Hell</option><option value="auto">Wie das System</option></select></label><label>Schriftgröße <output id="fontSize-out"></output><input id="fontSize" type="range" min="12" max="22" step="1"></label><p class="note">Websuche braucht ein Server-Backend und ist in dieser vollständig lokalen Variante nicht enthalten.</p></div><footer><button id="defaults" type="button">Standard</button><button id="save-settings" value="default" class="primary">Speichern</button></footer></form></dialog><script src="app.js"></script></body></html>
